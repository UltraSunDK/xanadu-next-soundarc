name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs exactly what rust-toolchain.toml pins, targets and components included.
      - name: Install toolchain
        run: rustup toolchain install

      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/i686-pc-windows-msvc/release/dinput8.dll
          archive: false

      - name: Attach DLL to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$env:GITHUB_REF_NAME" --generate-notes "target/i686-pc-windows-msvc/release/dinput8.dll"
        env:
          GH_TOKEN: ${{ github.token }}
