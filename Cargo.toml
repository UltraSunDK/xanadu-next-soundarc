[package]
name = "soundarc-inproc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "In-process SOUNDARC audio server for Xanadu Next (removes the separate soundarc.dll process)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/UltraSunDK/xanadu-next-soundarc"
publish = false

[lib]
name = "dinput8"
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
